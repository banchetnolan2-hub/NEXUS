name: Release Windows

# Builds the Windows release, runs the exported NEXUS.exe self-test under
# Wine, then publishes a GitHub release with the zip. Triggered by a version
# tag (v*) or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-godot

      - name: Run tests
        run: tools/run_tests.sh ~/godot/godot

      - name: Install Wine and rcedit (exe icon and version info)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine64
          mkdir -p ~/tools ~/.config/godot
          curl -sSL --retry 5 -o ~/tools/rcedit-x64.exe \
            https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          wine=$(command -v wine64 || echo /usr/lib/wine/wine64)
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/windows/rcedit = "%s"\nexport/windows/wine = "%s"\n' \
            "$HOME/tools/rcedit-x64.exe" "$wine" > ~/.config/godot/editor_settings-4.3.tres
          echo "WINE_BIN=$wine" >> "$GITHUB_ENV"

      - name: Export Windows release
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/NEXUS.exe
          test -s build/windows/NEXUS.exe

      - name: Self-test the exported NEXUS.exe (Wine, outside the project folder)
        run: |
          mkdir -p /tmp/dist && cp build/windows/NEXUS.exe /tmp/dist/
          cd /tmp/dist
          WINEDEBUG=-all "$WINE_BIN" NEXUS.exe --headless -- --selftest | tee selftest.log
          grep -q "RÉSULTAT : OK" selftest.log

      - name: Package
        id: pkg
        run: |
          name="NEXUS-${{ steps.tag.outputs.name }}-windows-x64.zip"
          cp README.md build/windows/LISEZMOI.md
          cp resources/fonts/Inter-LICENSE.txt resources/fonts/JetBrainsMono-LICENSE.txt build/windows/
          (cd build/windows && zip -q -r "../../$name" .)
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: NEXUS ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.pkg.outputs.file }}
          prerelease: true
          body_path: docs/release-notes.md
