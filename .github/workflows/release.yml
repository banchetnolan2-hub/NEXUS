name: Release Windows

# Publishes a GitHub release with the Windows build when a version tag
# (e.g. v0.1.0) is pushed. Can also be started by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-templates

      - name: Install Godot and Windows export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL --retry 5 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL --retry 5 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz \
            templates/version.txt \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            templates/windows_debug_x86_64.exe templates/windows_debug_x86_64_console.exe \
            -d "$dest"
          rm godot.zip templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Run tests
        run: ~/godot/godot --headless --path . -s res://tests/run_tests.gd

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/NEXUS.exe
          test -s build/windows/NEXUS.exe

      - name: Package
        id: pkg
        run: |
          name="NEXUS-${{ steps.tag.outputs.name }}-windows-x64.zip"
          cp README.md build/windows/LISEZMOI.md
          cp resources/fonts/Inter-LICENSE.txt resources/fonts/JetBrainsMono-LICENSE.txt build/windows/
          (cd build/windows && zip -q -r "../../$name" .)
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: NEXUS ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.pkg.outputs.file }}
          prerelease: true
          body: |
            Version Windows 64 bits de NEXUS (prototype — étape 1 : interface et identité visuelle).

            **Installation** : téléchargez le `.zip`, décompressez-le, lancez `NEXUS.exe`.
            Aucune installation n'est nécessaire. Les paramètres et sauvegardes sont stockés dans
            `%APPDATA%\Godot\app_userdata\NEXUS`.

            L'exécutable n'est pas signé : Windows SmartScreen peut afficher
            « Windows a protégé votre ordinateur ». Cliquez sur **Informations complémentaires → Exécuter quand même**.

            Configuration conseillée : carte graphique compatible Vulkan. Sans Vulkan, lancez
            `NEXUS.exe --rendering-method gl_compatibility`.
